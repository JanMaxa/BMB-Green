<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Alerts & Toast</title><link rel="stylesheet" href="_card.css">
<style>
  .alert { display:flex; gap:12px; padding:12px 14px; border-radius:10px; border:1px solid; font-size:13.5px; line-height:1.45 }
  .alert svg { width:20px; height:20px; flex-shrink:0; margin-top:1px }
  .alert b { font-weight:700; display:block }
</style></head>
<body>
<div class="stack-2">
  <div class="alert" style="background:#ECFBF1; border-color:#A6EBBE; color:#0B7332">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    <div><b>Instalace potvrzena</b>Technik dorazí v úterý 21. 5. mezi 9:00–11:00 h.</div>
  </div>
  <div class="alert" style="background:#EFF4FF; border-color:#BFD3FF; color:#1E40AF">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <div><b>Údržba sítě</b>V neděli 25. 5. od 2:00 do 4:00 h proběhne plánovaná údržba páteřní linky.</div>
  </div>
  <div class="alert" style="background:#FEF6E6; border-color:#FCE0AE; color:#9A4F00">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <div><b>Faktura po splatnosti</b>Prosíme o úhradu faktury 2025-04-0123 do 25. 5.</div>
  </div>
  <div class="alert" style="background:#FDECEC; border-color:#F8BFBF; color:#9F1818">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <div><b>Spojení nelze ověřit</b>Modem na adrese U Vodojemu 2281 neodpovídá od 04:12 h.</div>
  </div>
</div>
</body></html>
