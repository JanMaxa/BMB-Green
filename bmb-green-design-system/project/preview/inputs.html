<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Form Inputs</title><link rel="stylesheet" href="_card.css">
<style>
  .fld { display:flex; flex-direction:column; gap:6px }
  .fld label { font-size:12.5px; font-weight:600; color:#1E2221 }
  .input { font-family:Manrope; font-size:14px; padding:10px 12px; border:1px solid #D9DEDC; border-radius:10px; background:#fff; color:#1E2221; min-width:0; outline:none; }
  .input::placeholder { color:#8C9491 }
  .input:focus { border-color:#14AE4B; box-shadow:0 0 0 4px rgba(20,174,75,0.18) }
  .help { font-size:12px; color:#5F6764 }
  .err { font-size:12px; color:#DC2626 }
</style></head>
<body>
<div class="stack-4">
  <div class="row" style="gap:12px">
    <div class="fld" style="flex:1">
      <label>Jméno a příjmení</label>
      <input class="input" placeholder="např. Jan Novák">
      <div class="help">Pro fakturaci</div>
    </div>
    <div class="fld" style="flex:1">
      <label>E-mail</label>
      <input class="input" value="jan.novak@example.cz">
    </div>
  </div>
  <div class="row" style="gap:12px">
    <div class="fld" style="flex:2">
      <label>Adresa instalace</label>
      <div style="position:relative">
        <input class="input" placeholder="Ulice, č.p., obec" style="padding-left:38px; width:100%; border-color:#14AE4B; box-shadow:0 0 0 4px rgba(20,174,75,0.18)">
        <img src="../assets/icons/map-pin.svg" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#5F6764">
      </div>
      <div class="help">Focus state — green ring, 4 px @ 18%.</div>
    </div>
    <div class="fld" style="flex:1">
      <label>PSČ</label>
      <input class="input" value="250 01" style="border-color:#DC2626; background:#FDECEC50">
      <div class="err">PSČ je neplatné</div>
    </div>
  </div>
  <div class="row" style="gap:12px; align-items:center">
    <label class="row" style="gap:8px; cursor:pointer">
      <input type="checkbox" checked style="accent-color:#14AE4B; width:16px;height:16px">
      <span style="font-size:13px; color:#1E2221">Souhlasím s podmínkami</span>
    </label>
    <label class="row" style="gap:8px; cursor:pointer">
      <input type="radio" name="x" checked style="accent-color:#14AE4B">
      <span style="font-size:13px; color:#1E2221">Měsíčně</span>
    </label>
    <label class="row" style="gap:8px; cursor:pointer">
      <input type="radio" name="x" style="accent-color:#14AE4B">
      <span style="font-size:13px; color:#1E2221">Roční (–10 %)</span>
    </label>
    <div class="row" style="gap:8px; align-items:center; margin-left:auto">
      <span style="font-size:13px">Push notifikace</span>
      <span style="display:inline-block;width:34px;height:20px;background:#14AE4B;border-radius:999px;position:relative">
        <span style="position:absolute;top:2px;right:2px;width:16px;height:16px;background:#fff;border-radius:999px;box-shadow:0 1px 2px rgba(0,0,0,0.2)"></span>
      </span>
    </div>
  </div>
</div>
</body></html>
