<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shadows / Elevation</title><link rel="stylesheet" href="_card.css"></head>
<body style="background:#FAFBFA">
<div class="row" style="gap:18px; padding:20px 0">
  <div style="text-align:center">
    <div style="width:108px;height:80px;background:#fff;border-radius:10px;box-shadow:0 1px 2px rgba(18,21,20,0.04)"></div>
    <div style="font-size:11px;font-weight:600;color:#1E2221;margin-top:10px">shadow-xs</div>
    <div class="mono" style="font-size:10px;color:#5F6764">chips · hairline</div>
  </div>
  <div style="text-align:center">
    <div style="width:108px;height:80px;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(18,21,20,0.06),0 1px 2px rgba(18,21,20,0.04)"></div>
    <div style="font-size:11px;font-weight:600;color:#1E2221;margin-top:10px">shadow-sm</div>
    <div class="mono" style="font-size:10px;color:#5F6764">cards rest</div>
  </div>
  <div style="text-align:center">
    <div style="width:108px;height:80px;background:#fff;border-radius:10px;box-shadow:0 4px 14px rgba(18,21,20,0.06),0 2px 4px rgba(18,21,20,0.04)"></div>
    <div style="font-size:11px;font-weight:600;color:#1E2221;margin-top:10px">shadow-md</div>
    <div class="mono" style="font-size:10px;color:#5F6764">cards hover</div>
  </div>
  <div style="text-align:center">
    <div style="width:108px;height:80px;background:#fff;border-radius:10px;box-shadow:0 12px 32px rgba(18,21,20,0.08),0 4px 8px rgba(18,21,20,0.04)"></div>
    <div style="font-size:11px;font-weight:600;color:#1E2221;margin-top:10px">shadow-lg</div>
    <div class="mono" style="font-size:10px;color:#5F6764">menus · popovers</div>
  </div>
  <div style="text-align:center">
    <div style="width:108px;height:80px;background:#fff;border-radius:10px;box-shadow:0 24px 60px rgba(18,21,20,0.12),0 8px 16px rgba(18,21,20,0.05)"></div>
    <div style="font-size:11px;font-weight:600;color:#1E2221;margin-top:10px">shadow-xl</div>
    <div class="mono" style="font-size:10px;color:#5F6764">modals · sheets</div>
  </div>
  <div style="text-align:center">
    <div style="width:108px;height:80px;background:#fff;border-radius:10px;outline:2px solid #14AE4B;box-shadow:0 0 0 4px rgba(20,174,75,0.18)"></div>
    <div style="font-size:11px;font-weight:600;color:#0B7332;margin-top:10px">shadow-focus</div>
    <div class="mono" style="font-size:10px;color:#5F6764">focus ring</div>
  </div>
</div>
</body></html>
