<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing Scale</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="stack-2">
  <div class="row" style="align-items:flex-end; gap:18px">
    <div style="text-align:center"><div style="width:4px;height:48px;background:#14AE4B"></div><div class="mono" style="margin-top:6px;color:#5F6764">4</div><div style="font-size:11px;color:#1E2221;font-weight:600">s-1</div></div>
    <div style="text-align:center"><div style="width:8px;height:48px;background:#14AE4B"></div><div class="mono" style="margin-top:6px;color:#5F6764">8</div><div style="font-size:11px;color:#1E2221;font-weight:600">s-2</div></div>
    <div style="text-align:center"><div style="width:12px;height:48px;background:#14AE4B"></div><div class="mono" style="margin-top:6px;color:#5F6764">12</div><div style="font-size:11px;color:#1E2221;font-weight:600">s-3</div></div>
    <div style="text-align:center"><div style="width:16px;height:48px;background:#14AE4B"></div><div class="mono" style="margin-top:6px;color:#5F6764">16</div><div style="font-size:11px;color:#1E2221;font-weight:600">s-4</div></div>
    <div style="text-align:center"><div style="width:20px;height:48px;background:#14AE4B"></div><div class="mono" style="margin-top:6px;color:#5F6764">20</div><div style="font-size:11px;color:#1E2221;font-weight:600">s-5</div></div>
    <div style="text-align:center"><div style="width:24px;height:48px;background:#14AE4B"></div><div class="mono" style="margin-top:6px;color:#5F6764">24</div><div style="font-size:11px;color:#1E2221;font-weight:600">s-6</div></div>
    <div style="text-align:center"><div style="width:32px;height:48px;background:#14AE4B"></div><div class="mono" style="margin-top:6px;color:#5F6764">32</div><div style="font-size:11px;color:#1E2221;font-weight:600">s-8</div></div>
    <div style="text-align:center"><div style="width:40px;height:48px;background:#14AE4B"></div><div class="mono" style="margin-top:6px;color:#5F6764">40</div><div style="font-size:11px;color:#1E2221;font-weight:600">s-10</div></div>
    <div style="text-align:center"><div style="width:48px;height:48px;background:#14AE4B"></div><div class="mono" style="margin-top:6px;color:#5F6764">48</div><div style="font-size:11px;color:#1E2221;font-weight:600">s-12</div></div>
    <div style="text-align:center"><div style="width:64px;height:48px;background:#14AE4B"></div><div class="mono" style="margin-top:6px;color:#5F6764">64</div><div style="font-size:11px;color:#1E2221;font-weight:600">s-16</div></div>
    <div style="text-align:center"><div style="width:80px;height:48px;background:#14AE4B"></div><div class="mono" style="margin-top:6px;color:#5F6764">80</div><div style="font-size:11px;color:#1E2221;font-weight:600">s-20</div></div>
  </div>
  <div class="muted" style="font-size:12px; margin-top:6px">4-px base. s-6 (24) is the workhorse for card padding & row gaps. s-12+ for section separation.</div>
</div>
</body></html>
