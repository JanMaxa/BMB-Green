<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing in use</title><link rel="stylesheet" href="_card.css"></head>
<body style="background:#FAFBFA">
<!-- demonstrates spacing tokens applied to a real card -->
<div style="background:#fff; border:1px solid #EAEDEC; border-radius:10px; padding:24px; display:flex; flex-direction:column; gap:16px">
  <div style="display:flex; gap:16px; align-items:center">
    <div style="width:48px;height:48px;background:#ECFBF1;color:#14AE4B;border-radius:10px;display:flex;align-items:center;justify-content:center">
      <img src="../assets/icons/fiber.svg" style="width:24px;height:24px">
    </div>
    <div style="flex:1; display:flex;flex-direction:column; gap:4px">
      <div style="font-family:Manrope;font-weight:700;font-size:18px;color:#121514">Fibre patch panel · BRA-01</div>
      <div style="font-size:13px;color:#5F6764">Brandýs n. Labem, U Vodojemu</div>
    </div>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#ECFBF1;color:#0B7332;font-size:12px;font-weight:600">● Online</span>
  </div>
  <div style="height:1px; background:#EAEDEC"></div>
  <div style="display:flex; gap:24px">
    <div style="flex:1"><div style="font-size:11px;color:#5F6764;letter-spacing:0.08em;text-transform:uppercase;font-weight:700;margin-bottom:6px">Porty</div><div style="font-family:Manrope;font-weight:700;font-size:22px;color:#1E2221" class="tabular">38 / 48</div></div>
    <div style="flex:1"><div style="font-size:11px;color:#5F6764;letter-spacing:0.08em;text-transform:uppercase;font-weight:700;margin-bottom:6px">Uptime 30 d</div><div style="font-family:Manrope;font-weight:700;font-size:22px;color:#1E2221" class="tabular">99,97 %</div></div>
    <div style="flex:1"><div style="font-size:11px;color:#5F6764;letter-spacing:0.08em;text-transform:uppercase;font-weight:700;margin-bottom:6px">Posl. údržba</div><div style="font-family:Manrope;font-weight:700;font-size:22px;color:#1E2221">4. 5. 2026</div></div>
  </div>
</div>
<div style="margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#8C9491">padding s-6 (24) · gap s-4 (16) · inner gap s-6 (24) · divider 1 px</div>
</body></html>
