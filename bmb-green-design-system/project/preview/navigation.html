<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Navigation</title><link rel="stylesheet" href="_card.css">
<style>
  .nav { display:flex; align-items:center; gap:24px; padding:14px 20px; background:#fff; border:1px solid #EAEDEC; border-radius:14px; overflow:visible }
  .brand { font-family:Manrope, sans-serif; font-weight:800; font-size:18px; letter-spacing:-0.025em; line-height:1; white-space:nowrap; flex-shrink:0; color:#1E2221 }
  .brand .g { color:#14AE4B }
  .nav .links { display:flex; gap:22px }
  .nav a { color:#1E2221; font-size:14px; font-weight:500; text-decoration:none; white-space:nowrap; padding:4px 0; position:relative }
  .nav a.active { color:#0B7332; font-weight:700 }
  .nav a.active::after { content:""; position:absolute; left:0; right:0; bottom:-2px; height:2px; background:#14AE4B; border-radius:2px }
  .nav-cta {
    margin-left:auto; margin-right:0;
    font-family:Manrope; font-weight:600; font-size:13px;
    background:#14AE4B; color:#fff; border:none; border-radius:10px;
    padding:10px 16px; cursor:pointer; white-space:nowrap; flex-shrink:0; line-height:1;
  }
  .tab { padding:9px 14px; border-radius:8px; font-size:13.5px; font-weight:600; color:#5F6764; cursor:pointer }
  .tab.active { background:#fff; color:#1E2221; box-shadow:0 1px 3px rgba(18,21,20,0.06) }
  .crumb { display:inline-flex; align-items:center; gap:8px; font-size:13px; color:#5F6764 }
  .crumb b { color:#1E2221; font-weight:600 }
</style></head>
<body>
<div class="stack-4">
  <div class="nav">
    <span class="brand">BMB<span style="color:#1E2221">-</span><span class="g">Green</span></span>
    <div class="links">
      <a>Balíčky</a><a>Televize</a><a class="active">Internet</a><a>Volání</a><a>Kontakty</a>
    </div>
    <button class="nav-cta">Zjistit dostupnost</button>
  </div>
  <div class="row between">
    <div style="display:inline-flex; padding:4px; background:#F4F6F4; border-radius:10px; gap:4px">
      <span class="tab active">Měsíčně</span>
      <span class="tab">Roční · sleva 10 %</span>
      <span class="tab">3-letá</span>
    </div>
    <div class="crumb">
      <span>Zákazníci</span>
      <img src="../assets/icons/chevron-right.svg" style="width:14px;height:14px;opacity:.5">
      <span>Brandýs n. L.</span>
      <img src="../assets/icons/chevron-right.svg" style="width:14px;height:14px;opacity:.5">
      <b>Jan Novák</b>
    </div>
  </div>
</div>
</body></html>
