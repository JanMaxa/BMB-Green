<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors — Brand Green</title><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="stack-4">

      <div class="swatch"><div class="chip" style="background:#ECFBF1"></div><div class="name">green-50</div><div class="hex">#ECFBF1</div></div>
      <div class="swatch"><div class="chip" style="background:#D2F5DE"></div><div class="name">green-100</div><div class="hex">#D2F5DE</div></div>

    </div>
    <div class="row" style="gap:10px">
      <div class="swatch">
        <div class="chip" style="background:#14AE4B; position:relative">
          <span style="position:absolute;top:8px;left:10px;font-size:10px;font-weight:800;color:#fff;letter-spacing:0.08em">PRIMARY</span>

      <div class="swatch"><div class="chip" style="background:#0A5728"></div><div class="name">green-800</div><div class="hex">#0A5728</div></div>
      <div class="swatch"><div class="chip" style="background:#07401E"></div><div class="name">green-900</div><div class="hex">#07401E</div></div>
    </div>
