<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Logo</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="stack-4">
  <div class="row between" style="background:#fff;border:1px solid #EAEDEC;border-radius:10px;padding:28px 32px">
    <img src="../assets/logo.svg" alt="BMB-Green" style="height:32px">
    <div class="mono" style="color:var(--fg-muted)">logo.svg · on white</div>
  </div>
  <div class="row between" style="background:#1E2221;border-radius:10px;padding:28px 32px">
    <img src="../assets/logo-on-dark.svg" alt="BMB-Green" style="height:32px">
    <div class="mono" style="color:#BBC2C0">logo-on-dark.svg</div>
  </div>
  <div class="row" style="gap:8px;align-items:center;background:#FAFBFA;border:1px solid #EAEDEC;border-radius:10px;padding:16px 20px">
    <img src="../assets/logo.svg" style="height:48px">
    <img src="../assets/logo.svg" style="height:32px;margin-left:18px">
    <img src="../assets/logo.svg" style="height:22px">
    <img src="../assets/logo.svg" style="height:16px">
    <div class="mono" style="margin-left:auto;color:var(--fg-muted)">48 / 32 / 22 / 16 px</div>
  </div>
</div>
</body></html>
