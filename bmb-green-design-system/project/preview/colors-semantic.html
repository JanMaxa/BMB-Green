<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors — Semantic</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="stack-4">
  <div class="row" style="gap:10px">
    <div class="swatch"><div class="chip" style="background:#14AE4B"></div><div class="name">success</div><div class="hex">#14AE4B</div></div>
    <div class="swatch"><div class="chip" style="background:#2563EB"></div><div class="name">info</div><div class="hex">#2563EB</div></div>
    <div class="swatch"><div class="chip" style="background:#D97706"></div><div class="name">warning</div><div class="hex">#D97706</div></div>
    <div class="swatch"><div class="chip" style="background:#DC2626"></div><div class="name">danger</div><div class="hex">#DC2626</div></div>
  </div>
  <div class="row" style="gap:10px">
    <div class="swatch"><div class="chip" style="background:#ECFBF1"></div><div class="name">success-soft</div><div class="hex">#ECFBF1</div></div>
    <div class="swatch"><div class="chip" style="background:#EFF4FF"></div><div class="name">info-soft</div><div class="hex">#EFF4FF</div></div>
    <div class="swatch"><div class="chip" style="background:#FEF6E6"></div><div class="name">warning-soft</div><div class="hex">#FEF6E6</div></div>
    <div class="swatch"><div class="chip" style="background:#FDECEC"></div><div class="name">danger-soft</div><div class="hex">#FDECEC</div></div>
  </div>
  <div class="row" style="gap:8px; flex-wrap:wrap">
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#ECFBF1;color:#0B7332;font-size:12px;font-weight:600">● Aktivní</span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#EFF4FF;color:#1E40AF;font-size:12px;font-weight:600">● V instalaci</span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#FEF6E6;color:#9A4F00;font-size:12px;font-weight:600">● Pozastaveno</span>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#FDECEC;color:#9F1818;font-size:12px;font-weight:600">● Po splatnosti</span>
  </div>
</div>
</body></html>
