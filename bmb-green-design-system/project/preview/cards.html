<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cards</title><link rel="stylesheet" href="_card.css">
<style>
  .card { background:#fff; border:1px solid #EAEDEC; border-radius:10px; padding:18px 20px; }
  .card.hover { border-color:#D9DEDC; box-shadow:0 4px 14px rgba(18,21,20,0.06),0 2px 4px rgba(18,21,20,0.04) }
  .card.selected { background:#ECFBF1; border-color:#14AE4B }
  .lbl { font-size:10px; color:#5F6764; font-family:'JetBrains Mono',monospace }
</style></head>
<body style="background:#FAFBFA">
<div class="row" style="gap:14px; align-items:stretch">
  <div class="card" style="flex:1">
    <div style="font-size:11px; font-weight:800; color:#0B7332; letter-spacing:0.12em; text-transform:uppercase;margin-bottom:8px">DEFAULT</div>
    <div style="font-family:Manrope;font-weight:700;font-size:22px;color:#121514;letter-spacing:-0.01em">Domov 220</div>
    <div style="font-size:13px; color:#5F6764; margin:4px 0 12px">Internet, TV, neomezené volání</div>
    <div style="font-family:Manrope;font-weight:800;font-size:26px;color:#1E2221">699<span style="color:#5F6764;font-size:14px;font-weight:500"> Kč/měs</span></div>
    <div class="lbl" style="margin-top:14px">card · rest · shadow none</div>
  </div>
  <div class="card hover" style="flex:1">
    <div style="font-size:11px; font-weight:800; color:#0B7332; letter-spacing:0.12em; text-transform:uppercase;margin-bottom:8px">HOVER</div>
    <div style="font-family:Manrope;font-weight:700;font-size:22px;color:#121514;letter-spacing:-0.01em">Profi 500</div>
    <div style="font-size:13px; color:#5F6764; margin:4px 0 12px">Symetrická 500 Mb/s</div>
    <div style="font-family:Manrope;font-weight:800;font-size:26px;color:#1E2221">1 199<span style="color:#5F6764;font-size:14px;font-weight:500"> Kč/měs</span></div>
    <div class="lbl" style="margin-top:14px">card · hover · shadow-md</div>
  </div>
  <div class="card selected" style="flex:1; position:relative">
    <span style="position:absolute;top:-10px;right:14px;background:#14AE4B;color:#fff;font-size:10px;font-weight:800;letter-spacing:0.08em;padding:3px 8px;border-radius:999px">VYBRÁNO</span>
    <div style="font-size:11px; font-weight:800; color:#0B7332; letter-spacing:0.12em; text-transform:uppercase;margin-bottom:8px">SELECTED</div>
    <div style="font-family:Manrope;font-weight:700;font-size:22px;color:#121514;letter-spacing:-0.01em">Komplet 1G</div>
    <div style="font-size:13px; color:#5F6764; margin:4px 0 12px">Vše + fotovoltaika</div>
    <div style="font-family:Manrope;font-weight:800;font-size:26px;color:#1E2221">1 899<span style="color:#5F6764;font-size:14px;font-weight:500"> Kč/měs</span></div>
    <div class="lbl" style="margin-top:14px">card · selected · green-50</div>
  </div>
</div>
</body></html>
