<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Badges & Tags</title><link rel="stylesheet" href="_card.css">
<style>
  .pill { display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;font-family:Manrope }
  .pill::before { content:"●"; font-size:8px; line-height:1 }
  .tag { display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:600;font-family:Manrope; border:1px solid }
  .num { display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#DC2626;color:#fff;font-size:11px;font-weight:700; font-family:Manrope }
  .lbl { font-size:11px; color:#8C9491; font-family:'JetBrains Mono',monospace }
</style></head>
<body>
<div class="stack-4">
  <div>
    <div class="lbl" style="margin-bottom:8px">STATUS PILLS · CRM customer / service states</div>
    <div class="row" style="gap:8px; flex-wrap:wrap">
      <span class="pill" style="background:#ECFBF1;color:#0B7332">Aktivní</span>
      <span class="pill" style="background:#EFF4FF;color:#1E40AF">V instalaci</span>
      <span class="pill" style="background:#FEF6E6;color:#9A4F00">Pozastaveno</span>
      <span class="pill" style="background:#FDECEC;color:#9F1818">Po splatnosti</span>
      <span class="pill" style="background:#F4F6F4;color:#434947">Ukončeno</span>
      <span class="pill" style="background:#1E2221;color:#fff">VIP</span>
    </div>
  </div>
  <div>
    <div class="lbl" style="margin-bottom:8px">CATEGORY TAGS · inline filter / table chips</div>
    <div class="row" style="gap:8px; flex-wrap:wrap">
      <span class="tag" style="background:#fff;border-color:#D9DEDC;color:#1E2221">Internet</span>
      <span class="tag" style="background:#fff;border-color:#D9DEDC;color:#1E2221">Televize</span>
      <span class="tag" style="background:#fff;border-color:#D9DEDC;color:#1E2221">Volání</span>
      <span class="tag" style="background:#ECFBF1;border-color:#A6EBBE;color:#0B7332">Fotovoltaika</span>
      <span class="tag" style="background:#fff;border-color:#D9DEDC;color:#1E2221">CCTV</span>
      <span class="tag" style="background:#fff;border-color:#D9DEDC;color:#1E2221">EZS</span>
    </div>
  </div>
  <div class="row" style="gap:24px; align-items:center">
    <div class="row" style="gap:8px; align-items:center">
      <div style="position:relative">
        <img src="../assets/icons/bell.svg" style="width:22px;height:22px;color:#1E2221">
        <span class="num" style="position:absolute;top:-6px;right:-8px">3</span>
      </div>
      <span class="lbl">notification badge</span>
    </div>
    <div class="row" style="gap:8px;align-items:center">
      <div style="position:relative">
        <img src="../assets/icons/inbox.svg" style="width:22px;height:22px">
        <span class="num" style="position:absolute;top:-6px;right:-10px; background:#14AE4B">12</span>
      </div>
      <span class="lbl">queue counter</span>
    </div>
    <div class="row" style="gap:8px;align-items:center;margin-left:auto">
      <span class="pill" style="background:#14AE4B;color:#fff;font-size:11px">NOVÉ</span>
      <span class="pill" style="background:#1E2221;color:#fff;font-size:11px">BETA</span>
    </div>
  </div>
</div>
</body></html>
